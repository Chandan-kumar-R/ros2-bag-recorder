# docker compose up bridge                 headless bridge (robot)
# docker compose up dashboard              bridge + dashboard (workstation)
# docker compose run --rm recorder         terminal recorder, rosbag_param.yaml
#
# Host networking and IPC so DDS discovery and shared memory reach the
# robot's other nodes. Bags land in ./rosbags on the host.
# The dashboard needs X access first:  xhost +local:docker

x-ros: &ros
  image: ros2-bag-recorder:jazzy
  build:
    context: .
    target: headless
  network_mode: host
  ipc: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  volumes:
    - ./rosbags:/root/rosbags

services:
  bridge:
    <<: *ros

  recorder:
    <<: *ros
    profiles: [manual]
    command: ["ros2", "launch", "ros2_bag_recorder", "recorder.launch.py"]

  dashboard:
    <<: *ros
    image: ros2-bag-recorder:jazzy-dashboard
    build:
      context: .
      target: dashboard
    profiles: [gui]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY}
    volumes:
      - ./rosbags:/root/rosbags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
